
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-card">
        <h1>Weather App</h1>
        <p class="city">New York, USA</p>

        <div class="icon">🌤️</div>

        <h2>28°C</h2>
        <p class="condition">Partly Cloudy</p>

        <div class="details">
            <p>💧 Humidity: 65%</p>
            <p>💨 Wind Speed: 12 km/h</p>
        </div>

        <h3>Today's Forecast</h3>

        <div class="forecast">
            <div>
                <p>Mon</p>
                <span>☀️</span>
                <p>30°C</p>
            </div>

            <div>
                <p>Tue</p>
                <span>🌧️</span>
                <p>26°C</p>
            </div>

            <div>
                <p>Wed</p>
                <span>⛅</span>
                <p>28°C</p>
            </div>

            <div>
                <p>Thu</p>
                <span>🌧️</span>
                <p>22°C</p>
            </div>
        </div>
    </div>

</body>
</html>
